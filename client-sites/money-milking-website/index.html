<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Milking Website | High-Converting Landing Pages That Print Revenue</title>
<meta name="description" content="Stop losing customers to ugly websites. Money Milking Website builds high-converting landing pages that turn visitors into paying customers. Average 3.2x conversion lift.">
<meta property="og:title" content="Money Milking Website | Landing Pages That Print Revenue">
<meta property="og:description" content="High-converting landing pages that turn visitors into paying customers. Average 3.2x conversion lift. Get your free mockup today.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://moneymilkingwebsite.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--primary:#1B4332;
--primary-light:#2D6A4F;
--primary-dark:#0B2618;
--accent:#D4A843;
--accent-light:#E8C76A;
--accent-dark:#B8902F;
--bg:#FAFAF7;
--bg-alt:#F0EDE6;
--text:#1A1A1A;
--text-light:#555;
--text-lighter:#888;
--white:#FFFFFF;
--shadow:0 4px 24px rgba(0,0,0,0.08);
--shadow-lg:0 12px 48px rgba(0,0,0,0.12);
--radius:12px;
--transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Inter',sans-serif;color:var(--text);background:var(--bg);line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
ul{list-style:none}

/* Scrollbar */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg-alt)}
::-webkit-scrollbar-thumb{background:var(--primary-light);border-radius:4px}

/* Utility */
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.section{padding:100px 0}
.section-label{font-size:0.85rem;font-weight:700;text-transform:uppercase;letter-spacing:3px;color:var(--accent-dark);margin-bottom:12px}
.section-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,4vw,3rem);font-weight:800;line-height:1.2;margin-bottom:20px}
.section-subtitle{font-size:1.1rem;color:var(--text-light);max-width:600px;line-height:1.7}
.text-center{text-align:center}
.mx-auto{margin-left:auto;margin-right:auto}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:16px 36px;border-radius:50px;font-size:1rem;font-weight:700;cursor:pointer;border:none;transition:var(--transition);position:relative;overflow:hidden}
.btn-primary{background:var(--accent);color:var(--primary-dark)}
.btn-primary:hover{background:var(--accent-light);transform:translateY(-2px);box-shadow:0 8px 30px rgba(212,168,67,0.4)}
.btn-primary:active{transform:translateY(0)}
.btn-secondary{background:transparent;color:var(--white);border:2px solid rgba(255,255,255,0.3)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.btn-outline{background:transparent;color:var(--primary);border:2px solid var(--primary)}
.btn-outline:hover{background:var(--primary);color:var(--white);transform:translateY(-2px)}
.btn-large{padding:20px 48px;font-size:1.1rem}
.btn .arrow{transition:transform 0.3s ease}
.btn:hover .arrow{transform:translateX(4px)}

/* Pulse animation for CTA */
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,168,67,0.4)}70%{box-shadow:0 0 0 15px rgba(212,168,67,0)}}
.btn-pulse{animation:pulse 2s infinite}

/* Nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:16px 0;transition:var(--transition)}
.nav.scrolled{background:rgba(27,67,50,0.97);backdrop-filter:blur(20px);padding:10px 0;box-shadow:0 2px 20px rgba(0,0,0,0.15)}
.nav-inner{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;color:var(--white)}
.logo-icon{width:40px;height:40px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900;color:var(--primary-dark);position:relative}
.logo-icon::after{content:'';position:absolute;top:-2px;right:-2px;width:10px;height:10px;background:#4ADE80;border-radius:50%;border:2px solid var(--primary)}
.nav-links{display:flex;align-items:center;gap:32px}
.nav-links a{color:rgba(255,255,255,0.8);font-size:0.95rem;font-weight:500;transition:var(--transition);position:relative}
.nav-links a:hover{color:var(--white)}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:var(--accent);transition:width 0.3s ease}
.nav-links a:hover::after{width:100%}
.nav-cta{padding:10px 24px;font-size:0.9rem}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px}
.hamburger span{width:28px;height:2.5px;background:var(--white);border-radius:2px;transition:var(--transition)}
.mobile-menu{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--primary-dark);z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:30px;opacity:0;pointer-events:none;transition:opacity 0.3s ease}
.mobile-menu.active{opacity:1;pointer-events:all}
.mobile-menu a{color:var(--white);font-size:1.5rem;font-weight:600}

/* Hero */
.hero{min-height:100vh;background:linear-gradient(165deg,var(--primary-dark) 0%,var(--primary) 40%,var(--primary-light) 100%);position:relative;display:flex;align-items:center;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;right:-20%;width:80%;height:200%;background:radial-gradient(ellipse,rgba(212,168,67,0.08) 0%,transparent 70%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;position:relative;z-index:2}
.hero-content{padding:120px 0 80px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:50px;padding:8px 20px;font-size:0.85rem;color:rgba(255,255,255,0.9);margin-bottom:28px;backdrop-filter:blur(10px)}
.hero-badge .dot{width:8px;height:8px;background:#4ADE80;border-radius:50%;animation:pulse 2s infinite}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2.5rem,5vw,4rem);font-weight:800;color:var(--white);line-height:1.1;margin-bottom:24px}
.hero h1 .highlight{color:var(--accent);position:relative;display:inline-block}
.hero h1 .highlight::after{content:'';position:absolute;bottom:4px;left:0;right:0;height:8px;background:rgba(212,168,67,0.3);border-radius:4px}
.hero-desc{font-size:1.15rem;color:rgba(255,255,255,0.75);line-height:1.8;margin-bottom:36px;max-width:520px}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:48px}
.hero-stats{display:flex;gap:48px}
.hero-stat{text-align:left}
.hero-stat-number{font-size:1.8rem;font-weight:800;color:var(--accent)}
.hero-stat-label{font-size:0.85rem;color:rgba(255,255,255,0.6)}

/* Hero Visual */
.hero-visual{position:relative;padding:120px 0 80px}
.hero-mockup{background:var(--white);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;transform:perspective(1000px) rotateY(-5deg) rotateX(2deg);transition:transform 0.6s ease}
.hero-mockup:hover{transform:perspective(1000px) rotateY(-2deg) rotateX(1deg)}
.mockup-bar{background:#F5F5F5;padding:12px 16px;display:flex;align-items:center;gap:8px}
.mockup-dot{width:10px;height:10px;border-radius:50%}
.mockup-dot:nth-child(1){background:#FF5F56}
.mockup-dot:nth-child(2){background:#FFBD2E}
.mockup-dot:nth-child(3){background:#27CA40}
.mockup-url{margin-left:12px;background:#E8E8E8;border-radius:6px;padding:4px 16px;font-size:0.75rem;color:#999;flex:1}
.mockup-body{padding:24px;min-height:300px;background:linear-gradient(135deg,#F8F9FA,#FFFFFF)}
.mockup-hero-block{background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:12px;padding:32px;margin-bottom:16px;color:white}
.mockup-hero-block h3{font-size:1.1rem;font-weight:700;margin-bottom:8px}
.mockup-hero-block p{font-size:0.75rem;opacity:0.8;margin-bottom:12px}
.mockup-btn-fake{background:var(--accent);color:var(--primary-dark);padding:8px 20px;border-radius:20px;font-size:0.7rem;font-weight:700;display:inline-block}
.mockup-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mockup-card{background:#F0F4F0;border-radius:8px;padding:16px;text-align:center}
.mockup-card-icon{font-size:1.5rem;margin-bottom:4px}
.mockup-card span{font-size:0.65rem;color:#666}
.mockup-conversion{margin-top:16px;background:#F0FFF4;border:1px solid #BBF7D0;border-radius:8px;padding:12px;display:flex;align-items:center;gap:8px}
.mockup-conversion .up{color:#16A34A;font-weight:700;font-size:0.85rem}
.mockup-conversion span{font-size:0.75rem;color:#555}

/* Floating elements */
.float-badge{position:absolute;background:var(--white);border-radius:12px;padding:14px 20px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;font-size:0.85rem;font-weight:600;z-index:3;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.float-1{top:140px;right:-20px;animation-delay:0s}
.float-2{bottom:100px;left:-10px;animation-delay:2s}
.float-badge .badge-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.float-1 .badge-icon{background:#FEF3C7}
.float-2 .badge-icon{background:#DCFCE7}

/* Logos/Social Proof Bar */
.trust-bar{background:var(--white);border-top:1px solid #eee;border-bottom:1px solid #eee;padding:40px 0}
.trust-inner{display:flex;align-items:center;justify-content:center;gap:48px;flex-wrap:wrap}
.trust-text{font-size:0.9rem;color:var(--text-lighter);font-weight:500;white-space:nowrap}
.trust-logos{display:flex;align-items:center;gap:40px;flex-wrap:wrap;justify-content:center}
.trust-logo{font-size:1.2rem;font-weight:800;color:#CCC;letter-spacing:1px;transition:color 0.3s}
.trust-logo:hover{color:var(--primary)}

/* Problems */
.problems{background:var(--bg)}
.problems-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}
.problem-card{background:var(--white);border-radius:var(--radius);padding:36px;border:1px solid #eee;transition:var(--transition);position:relative;overflow:hidden}
.problem-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.problem-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-light));opacity:0;transition:opacity 0.3s}
.problem-card:hover::before{opacity:1}
.problem-icon{font-size:2.5rem;margin-bottom:16px}
.problem-card h3{font-size:1.15rem;font-weight:700;margin-bottom:10px}
.problem-card p{font-size:0.95rem;color:var(--text-light);line-height:1.7}

/* Services / What We Build */
.services{background:var(--primary-dark);color:var(--white);position:relative;overflow:hidden}
.services::before{content:'';position:absolute;top:0;right:0;width:50%;height:100%;background:radial-gradient(ellipse at right,rgba(212,168,67,0.05),transparent);pointer-events:none}
.services .section-label{color:var(--accent)}
.services .section-subtitle{color:rgba(255,255,255,0.6)}
.services-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:48px}
.service-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:40px;transition:var(--transition);position:relative}
.service-card:hover{background:rgba(255,255,255,0.08);border-color:rgba(212,168,67,0.3);transform:translateY(-4px)}
.service-number{font-size:3rem;font-weight:900;color:rgba(212,168,67,0.15);position:absolute;top:20px;right:24px;line-height:1}
.service-card h3{font-size:1.25rem;font-weight:700;margin-bottom:10px;color:var(--white)}
.service-card p{color:rgba(255,255,255,0.6);line-height:1.7;font-size:0.95rem;margin-bottom:16px}
.service-features{display:flex;flex-wrap:wrap;gap:8px}
.service-tag{background:rgba(212,168,67,0.1);border:1px solid rgba(212,168,67,0.2);padding:4px 14px;border-radius:20px;font-size:0.8rem;color:var(--accent)}

/* Process */
.process{background:var(--bg-alt)}
.process-timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-top:48px;position:relative}
.process-timeline::before{content:'';position:absolute;top:45px;left:12%;right:12%;height:2px;background:linear-gradient(90deg,var(--accent),var(--primary-light));opacity:0.3}
.process-step{text-align:center;position:relative}
.step-circle{width:72px;height:72px;border-radius:50%;background:var(--white);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 20px;position:relative;z-index:2;transition:var(--transition)}
.process-step:hover .step-circle{background:var(--accent);transform:scale(1.1)}
.step-number{font-size:0.75rem;font-weight:800;color:var(--accent);margin-bottom:4px;letter-spacing:2px}
.process-step h3{font-size:1.05rem;font-weight:700;margin-bottom:8px}
.process-step p{font-size:0.9rem;color:var(--text-light);line-height:1.6}

/* Portfolio */
.portfolio{background:var(--white)}
.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}
.portfolio-card{border-radius:var(--radius);overflow:hidden;position:relative;cursor:pointer;group:true;border:1px solid #eee}
.portfolio-preview{height:280px;position:relative;overflow:hidden}
.portfolio-preview-bg{width:100%;height:100%;transition:transform 0.5s ease}
.portfolio-card:hover .portfolio-preview-bg{transform:scale(1.05)}
.p-bg-1{background:linear-gradient(135deg,#667EEA,#764BA2)}
.p-bg-2{background:linear-gradient(135deg,#F093FB,#F5576C)}
.p-bg-3{background:linear-gradient(135deg,#4FACFE,#00F2FE)}
.portfolio-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s}
.portfolio-card:hover .portfolio-overlay{opacity:1}
.portfolio-overlay span{color:white;font-weight:700;font-size:1rem;border:2px solid white;padding:10px 24px;border-radius:50px}
.portfolio-inner{padding:20px 16px;display:flex;flex-direction:column;gap:6px}
.portfolio-inner-fake{padding:20px;display:flex;flex-direction:column;gap:12px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80%}
.portfolio-fake-h{height:14px;background:rgba(255,255,255,0.9);border-radius:4px;width:70%}
.portfolio-fake-p{height:8px;background:rgba(255,255,255,0.5);border-radius:4px;width:100%}
.portfolio-fake-btn{height:28px;background:rgba(255,255,255,0.9);border-radius:20px;width:40%;margin-top:4px}
.portfolio-info h3{font-size:1rem;font-weight:700}
.portfolio-info p{font-size:0.85rem;color:var(--text-light)}
.portfolio-result{display:flex;align-items:center;gap:6px;font-size:0.85rem;font-weight:600;color:#16A34A}

/* Testimonials */
.testimonials{background:var(--bg)}
.testimonials-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}
.testimonial-card{background:var(--white);border-radius:var(--radius);padding:32px;border:1px solid #eee;transition:var(--transition);position:relative}
.testimonial-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.testimonial-stars{color:var(--accent);font-size:1.1rem;margin-bottom:16px;letter-spacing:2px}
.testimonial-text{font-size:0.95rem;color:var(--text-light);line-height:1.8;margin-bottom:20px;font-style:italic}
.testimonial-author{display:flex;align-items:center;gap:12px}
.testimonial-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;color:white}
.ta-1{background:linear-gradient(135deg,#667EEA,#764BA2)}
.ta-2{background:linear-gradient(135deg,#F093FB,#F5576C)}
.ta-3{background:linear-gradient(135deg,#4FACFE,#00F2FE)}
.testimonial-name{font-weight:700;font-size:0.95rem}
.testimonial-role{font-size:0.8rem;color:var(--text-lighter)}
.testimonial-card .quote-mark{position:absolute;top:16px;right:24px;font-size:3rem;color:#f0ede6;font-family:Georgia,serif;line-height:1}

/* Results/Numbers */
.results{background:linear-gradient(165deg,var(--primary),var(--primary-light));color:var(--white);position:relative;overflow:hidden}
.results::after{content:'';position:absolute;bottom:-50%;left:-10%;width:60%;height:200%;background:radial-gradient(ellipse,rgba(212,168,67,0.06),transparent);pointer-events:none}
.results .section-label{color:var(--accent)}
.results .section-subtitle{color:rgba(255,255,255,0.6)}
.results-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:48px}
.result-card{text-align:center;padding:32px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);transition:var(--transition)}
.result-card:hover{background:rgba(255,255,255,0.1);transform:translateY(-4px)}
.result-number{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:800;color:var(--accent);margin-bottom:4px}
.result-label{font-size:0.9rem;color:rgba(255,255,255,0.7)}

/* Pricing */
.pricing{background:var(--white)}
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}
.pricing-card{background:var(--bg);border-radius:var(--radius);padding:40px;border:2px solid #eee;transition:var(--transition);position:relative;overflow:hidden}
.pricing-card.popular{border-color:var(--accent);background:var(--white)}
.pricing-card.popular::before{content:'MOST POPULAR';position:absolute;top:20px;right:-36px;background:var(--accent);color:var(--primary-dark);font-size:0.7rem;font-weight:800;padding:6px 48px;transform:rotate(45deg);letter-spacing:1px}
.pricing-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.pricing-name{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.pricing-desc{font-size:0.85rem;color:var(--text-lighter);margin-bottom:20px}
.pricing-price{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:800;margin-bottom:4px}
.pricing-price span{font-size:1rem;font-weight:400;color:var(--text-lighter)}
.pricing-note{font-size:0.8rem;color:var(--text-lighter);margin-bottom:24px}
.pricing-features{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.pricing-feature{display:flex;align-items:center;gap:10px;font-size:0.9rem}
.pricing-feature .check{color:#16A34A;font-weight:700;font-size:1.1rem}
.pricing-card .btn{width:100%;justify-content:center}

/* FAQ */
.faq{background:var(--bg-alt)}
.faq-list{max-width:720px;margin:48px auto 0}
.faq-item{background:var(--white);border-radius:var(--radius);margin-bottom:12px;border:1px solid #eee;overflow:hidden;transition:var(--transition)}
.faq-item:hover{border-color:var(--accent)}
.faq-question{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:600;font-size:1rem;gap:16px}
.faq-toggle{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:var(--transition);flex-shrink:0}
.faq-item.active .faq-toggle{background:var(--accent);color:var(--primary-dark);transform:rotate(45deg)}
.faq-answer{max-height:0;overflow:hidden;transition:max-height 0.4s ease,padding 0.4s ease}
.faq-answer-inner{padding:0 24px 20px;font-size:0.95rem;color:var(--text-light);line-height:1.7}

/* Final CTA */
.final-cta{background:linear-gradient(165deg,var(--primary-dark),var(--primary));color:var(--white);text-align:center;position:relative;overflow:hidden;padding:120px 0}
.final-cta::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.final-cta .section-title{color:var(--white);font-size:clamp(2.2rem,4.5vw,3.2rem)}
.final-cta .section-subtitle{color:rgba(255,255,255,0.7);margin:0 auto 40px}
.final-cta-guarantee{display:inline-flex;align-items:center;gap:8px;margin-top:24px;font-size:0.9rem;color:rgba(255,255,255,0.6)}

/* Footer */
.footer{background:var(--primary-dark);color:rgba(255,255,255,0.6);padding:60px 0 30px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px;margin-bottom:48px}
.footer-brand .logo{margin-bottom:16px}
.footer-brand p{font-size:0.9rem;line-height:1.7;margin-bottom:16px;max-width:280px}
.footer-social{display:flex;gap:12px}
.footer-social a{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:0.9rem;transition:var(--transition)}
.footer-social a:hover{background:var(--accent);color:var(--primary-dark)}
.footer-col
